name: Desktop test builds
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', 'aircard_desktop/**', '*.py', 'tests/**', 'requirements-desktop.*', '.github/workflows/desktop.yml', 'Sources/**']
  pull_request:
    paths: ['desktop/**', 'aircard_desktop/**', '*.py', 'tests/**', 'requirements-desktop.*', '.github/workflows/desktop.yml', 'Sources/**']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            architecture: x64
          - os: macos-14
            architecture: arm64
          - os: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - run: python -m pip install -r requirements-desktop.lock
      - run: python -m unittest discover -s tests -q
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm test && pnpm build
        working-directory: desktop
      - if: runner.os == 'macOS'
        run: make all
      - run: node scripts/package-backend.mjs
        working-directory: desktop
        env:
          AIRCARD_PYTHON: python
      - name: Test-only desktop build
        run: pnpm tauri build --no-bundle --features e2e --config src-tauri/tauri.e2e.conf.json
        working-directory: desktop
        env:
          VITE_E2E: '1'
      - name: Desktop smoke test
        run: pnpm test:e2e
        working-directory: desktop
        env:
          AIRCARD_DATA_DIR: ${{ runner.temp }}/AirCard desktop smoke
      - name: Windows installer (no test plugins)
        if: runner.os == 'Windows'
        run: pnpm bundle
        working-directory: desktop
      - name: macOS app and DMG (no test plugins)
        if: runner.os == 'macOS'
        run: pnpm bundle --config src-tauri/tauri.macos.conf.json
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: AirCard-test-${{ matrix.os }}-${{ matrix.architecture }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/test-results/
          if-no-files-found: error
